name: Generate biography PDFs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/generate_biography_pdfs.py"
      - "JS/objects.js"
      - "assets/IMG/portrait/**"
      - ".github/workflows/generate-biography-pdfs.yml"

permissions:
  contents: write

concurrency:
  group: biography-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.9 Pillow==12.2.0

      - name: Generate biographies
        run: python tools/generate_biography_pdfs.py

      - name: Verify generated files
        run: |
          test -s assets/pdf/ulrike-albeseder-bio.pdf
          test -s assets/pdf/uwe-hanewald-bio.pdf
          test -s assets/pdf/wolfgang-maye-bio.pdf
          test -s assets/pdf/wolfgang-disch-bio.pdf

      - name: Commit generated PDFs
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/pdf/ulrike-albeseder-bio.pdf \
            assets/pdf/uwe-hanewald-bio.pdf \
            assets/pdf/wolfgang-maye-bio.pdf \
            assets/pdf/wolfgang-disch-bio.pdf

          if git diff --cached --quiet; then
            echo "Biography PDFs are already current."
            exit 0
          fi

          git commit -m "Generate branded biography PDFs"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"
